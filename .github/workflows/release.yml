name: Publicar release do Cated

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar a aplicação web
        run: npm run build

      - name: Gerar o instalador sem publicar
        run: npx electron-builder --win --x64 --publish never

      - name: Criar ou atualizar o release com upload sequencial
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG
          $releaseExists = gh release view $tag --repo $env:REPOSITORY 2>$null
          if (-not $releaseExists) {
            gh release create $tag --repo $env:REPOSITORY --title "Cated $version" --notes "Release automático do Cated $version"
          }
          gh release upload $tag "release/Cated-Setup-$version.exe" "release/Cated-Setup-$version.exe.blockmap" "release/latest.yml" --repo $env:REPOSITORY --clobber
